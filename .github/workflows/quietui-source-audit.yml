name: QuietUI static source audit

on:
  push:
    paths:
      - "QuietUI/**"
      - ".github/workflows/quietui-source-audit.yml"
  pull_request:
    paths:
      - "QuietUI/**"
      - ".github/workflows/quietui-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for static auditor
        run: python -m unittest discover -s QuietUI/devtools -p "test_*.py" -v
      - name: Validate raw source parts without executing Luau
        run: python QuietUI/devtools/audit_bundle.py --json
